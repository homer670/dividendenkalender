# Builds an installable Android app (APK) and publishes it as a GitHub release.
name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Android-Projekt erzeugen
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk portfolio.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android-App ${{ github.run_number }}
          make_latest: true
          body: |
            Installierbare Android-App (APK). Auf dem Handy herunterladen und öffnen.
            Beim ersten Mal muss die Installation aus unbekannten Quellen erlaubt werden.
          files: portfolio.apk
